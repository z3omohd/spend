
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasan Expense Tracker - عداد  مصاريف التسوق</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* إعداد الميزانية المستهدفة */
        .budget-setup {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            align-items: center;
        }

        .budget-setup label {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .budget-setup input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        /* لوحة العرض الإجمالي */
        .display-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .display-box .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .display-box .total-amount {
            font-size: 2.3rem;
            font-weight: bold;
            color: var(--success);
            transition: color 0.3s;
        }

        .display-box .session-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* شريط تقدم الميزانية */
        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--success);
            transition: width 0.3s, background 0.3s;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px 18px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .items-list {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .item-row span {
            color: var(--text-muted);
        }

        .item-row button {
            background: none;
            color: var(--danger);
            padding: 2px 6px;
            font-size: 0.8rem;
        }

        .archives-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-bottom: 12px;
        }

        .archives-section h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .archive-card {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .archive-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            background: var(--border);
            color: var(--text-main);
        }

        .btn-sm:hover {
            background: var(--primary);
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 8px;
        }

        /* توقيع متجر وسن الرقمي في التذييل */
        footer.app-footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Wasan Expense Tracker</h1>
            <p>عداد  مصاريف التسوق الذكي</p>
        </header>

        <!-- حقل تحديد سقف الميزانية -->
        <div class="budget-setup">
            <label for="budgetLimit">سقف الميزانية:</label>
            <input type="number" id="budgetLimit" placeholder="مثلاً: 1000" oninput="updateBudgetProgress()">
        </div>

        <!-- لوحة العرض الإجمالي -->
        <div class="display-box">
            <div class="label">إجمالي جلسة التسوق الحالية</div>
            <div class="total-amount" id="totalDisplay">0.00</div>
            <div class="session-date" id="sessionDate">بداية الجلسة: -</div>
        </div>

        <!-- شريط التقدم البصري للميزانية -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-text">
                <span id="progressPercent">0% من الميزانية</span>
                <span id="budgetRemaining">المتبقي: -</span>
            </div>
        </div>

        <!-- حقل إدخال المبلغ -->
        <div class="input-group">
            <input type="number" id="amountInput" placeholder="أدخل السعر (مثلاً: 25.5)" step="any" inputmode="decimal">
            <button class="btn-primary" onclick="addAmount()">➕ إضافة</button>
        </div>

        <!-- قائمة السلع المدخلة لهذه الجلسة -->
        <div class="items-list" id="itemsList">
            <div class="empty-msg">لم يتم إدخال سلع بعد</div>
        </div>

        <!-- الأزرار الإدارية للجلسة -->
        <div class="actions-grid">
            <button class="btn-primary" onclick="saveAndResetSession()">💾 حفظ الشهر</button>
            <button class="btn-danger" onclick="resetCurrentSession()">🔄 تصفير العداد</button>
        </div>

        <!-- قسم الأرشيف الشهري -->
        <div class="archives-section">
            <h3>📊 أرشيف المصروفات الشهرية</h3>
            <div id="archivesList">
                <div class="empty-msg">لا توجد أشهر مؤرشفة بعد</div>
            </div>
        </div>

        <!-- توقيع متجر وسن الرقمي في التذييل -->
        <footer class="app-footer">
            جميع الحقوق محفوظة &copy; 2026 — <strong>متجر وسن التقني (Wasan Tech Store)</strong>
        </footer>
    </div>

    <script>
        let currentTotal = 0;
        let sessionItems = [];
        let sessionStartTime = "";

        window.onload = function() {
            loadCurrentSession();
            renderArchives();
            if (!sessionStartTime) {
                setSessionStart();
            }
            const savedBudget = localStorage.getItem('wasan_budget_limit');
            if(savedBudget) {
                document.getElementById('budgetLimit').value = savedBudget;
            }
            updateBudgetProgress();
        };

        // ضبط التاريخ الميلادي حصراً (بدون أي تقويم هجري)
        function setSessionStart() {
            const now = new Date();
            sessionStartTime = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + 
                               " (" + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + ")";
            document.getElementById('sessionDate').innerText = "بداية الجلسة: " + sessionStartTime;
        }

        function addAmount() {
            const input = document.getElementById('amountInput');
            const val = parseFloat(input.value);

            if (isNaN(val) || val <= 0) {
                alert('الرجاء إدخال مبلغ صحيح أكبر من الصفر');
                return;
            }

            currentTotal += val;
            sessionItems.push({ id: Date.now(), amount: val });
            
            input.value = '';
            input.focus();
            updateUI();
            saveCurrentSessionToStorage();
        }

        function removeItem(id) {
            const index = sessionItems.findIndex(item => item.id === id);
            if (index !== -1) {
                currentTotal -= sessionItems[index].amount;
                sessionItems.splice(index, 1);
                updateUI();
                saveCurrentSessionToStorage();
            }
        }

        function updateUI() {
            document.getElementById('totalDisplay').innerText = currentTotal.toFixed(2);
            updateBudgetProgress();
            
            const listContainer = document.getElementById('itemsList');
            if (sessionItems.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">لم يتم إدخال سلع بعد</div>';
                return;
            }

            let html = '';
            sessionItems.slice().reverse().forEach(item => {
                html += `
                    <div class="item-row">
                        <strong>${item.amount.toFixed(2)} ر.س</strong>
                        <button onclick="removeItem(${item.id})">حذف ✕</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function updateBudgetProgress() {
            const limitInput = document.getElementById('budgetLimit').value;
            const limit = parseFloat(limitInput);
            localStorage.setItem('wasan_budget_limit', limitInput);

            const fill = document.getElementById('progressBarFill');
            const percentText = document.getElementById('progressPercent');
            const remainingText = document.getElementById('budgetRemaining');
            const totalDisplay = document.getElementById('totalDisplay');

            if (!limit || limit <= 0) {
                fill.style.width = '0%';
                fill.style.background = 'var(--success)';
                percentText.innerText = 'أدخل سقف الميزانية للمتابعة';
                remainingText.innerText = 'المتبقي: -';
                totalDisplay.style.color = 'var(--success)';
                return;
            }

            let percent = (currentTotal / limit) * 100;
            if (percent > 100) percent = 100;
            fill.style.width = percent + '%';

            let remaining = limit - currentTotal;
            remainingText.innerText = 'المتبقي: ' + remaining.toFixed(2) + ' ر.س';
            percentText.innerText = percent.toFixed(0) + '% من الميزانية';

            if (percent >= 90) {
                fill.style.background = 'var(--danger)';
                totalDisplay.style.color = 'var(--danger)';
            } else if (percent >= 75) {
                fill.style.background = 'var(--warning)';
                totalDisplay.style.color = 'var(--warning)';
            } else {
                fill.style.background = 'var(--success)';
                totalDisplay.style.color = 'var(--success)';
            }
        }

        function saveCurrentSessionToStorage() {
            const data = {
                total: currentTotal,
                items: sessionItems,
                startTime: sessionStartTime
            };
            localStorage.setItem('wasan_current_session', JSON.stringify(data));
        }

        function loadCurrentSession() {
            const saved = localStorage.getItem('wasan_current_session');
            if (saved) {
                const data = JSON.parse(saved);
                currentTotal = data.total || 0;
                sessionItems = data.items || [];
                sessionStartTime = data.startTime || "";
                if (sessionStartTime) {
                    document.getElementById('sessionDate').innerText = "بداية الجلسة: " + sessionStartTime;
                }
                updateUI();
            }
        }

        function resetCurrentSession() {
            if (confirm('هل أنت متأكد من تصفير العداد الحالي؟')) {
                currentTotal = 0;
                sessionItems = [];
                setSessionStart();
                updateUI();
                localStorage.removeItem('wasan_current_session');
            }
        }

        function saveAndResetSession() {
            if (currentTotal <= 0) {
                alert('لا يوجد مصروفات لتسجيلها هذا الشهر.');
                return;
            }

            const now = new Date();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const currentMonthYear = monthNames[now.getMonth()] + " " + now.getFullYear();

            let archives = JSON.parse(localStorage.getItem('wasan_expense_archives_v2') || '{}');
            
            if (archives[currentMonthYear]) {
                archives[currentMonthYear].total += currentTotal;
                archives[currentMonthYear].items = archives[currentMonthYear].items.concat(sessionItems);
            } else {
                archives[currentMonthYear] = {
                    total: currentTotal,
                    items: [...sessionItems]
                };
            }

            localStorage.setItem('wasan_expense_archives_v2', JSON.stringify(archives));

            currentTotal = 0;
            sessionItems = [];
            setSessionStart();
            updateUI();
            localStorage.removeItem('wasan_current_session');
            renderArchives();
            alert('تم حفظ وترحيل المصروفات بنجاح إلى الأرشيف الشهري الميلادي!');
        }

        function renderArchives() {
            const archivesContainer = document.getElementById('archivesList');
            const archives = JSON.parse(localStorage.getItem('wasan_expense_archives_v2') || '{}');
            const keys = Object.keys(archives);

            if (keys.length === 0) {
                archivesContainer.innerHTML = '<div class="empty-msg">لا توجد أشهر مؤرشفة بعد</div>';
                return;
            }

            let html = '';
            keys.reverse().forEach(month => {
                html += `
                    <div class="archive-card">
                        <span><strong>${month}</strong></span>
                        <div class="archive-actions">
                            <span style="color: var(--success); font-weight: bold;">${archives[month].total.toFixed(2)} ر.س</span>
                            <button class="btn-sm" onclick="exportMonthCSV('${month}')">📥 CSV</button>
                        </div>
                    </div>
                `;
            });
            archivesContainer.innerHTML = html;
        }

        function exportMonthCSV(monthKey) {
            const archives = JSON.parse(localStorage.getItem('wasan_expense_archives_v2') || '{}');
            const data = archives[monthKey];
            if (!data) return;

            let csvContent = "\uFEFFMonth,Amount (SAR)\n";
            csvContent += `"${monthKey}",${data.total.toFixed(2)}\n`;

            const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Wasan_Expenses_${monthKey.replace(' ', '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
